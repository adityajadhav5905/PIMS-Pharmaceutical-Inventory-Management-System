version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: medical-inventory-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    env_file:
      - .env
    ports:
      - "5000:5000"
    depends_on:
      - mongo
      - ml-service

  client:
    build:
      context: .
      dockerfile: docker/client.Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api/v1
    depends_on:
      - server

  ml-service:
    build:
      context: .
      dockerfile: docker/ml-service.Dockerfile
    ports:
      - "8000:8000"

volumes:
  mongo_data:
