version: "3.9"

services:
  mongodb:
    image: mongo:6.0
    container_name: medical-inventory-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    environment:
      - SERVER_PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/pims
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-change_this_jwt_access_secret_for_production}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-change_this_jwt_refresh_secret_for_production}
      - ML_SERVICE_URL=http://ml-service:8000
      - CLIENT_URL=http://localhost:5173
      - NODE_ENV=production
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
      - ml-service

  client:
    build:
      context: .
      dockerfile: docker/client.Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api/v1
    depends_on:
      - server

  ml-service:
    build:
      context: .
      dockerfile: docker/ml-service.Dockerfile
    ports:
      - "8000:8000"

volumes:
  mongo_data:
