name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  client-build:
    name: Client Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install Client Dependencies
        run: npm ci
        working-directory: client

      - name: Build Client
        run: npm run build
        working-directory: client

  server-test:
    name: Server Tests & Verification
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install Server Dependencies
        run: npm ci
        working-directory: server

      - name: Seed Test Database
        run: npm run seed
        working-directory: server
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://127.0.0.1:27017/pims_test
          JWT_ACCESS_SECRET: test_ci_access_secret_64_bytes_00000000000000000000000000000000
          JWT_REFRESH_SECRET: test_ci_refresh_secret_64_bytes_00000000000000000000000000000000

      - name: Run Test Suite
        run: npm run test:all
        working-directory: server
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://127.0.0.1:27017/pims_test
          JWT_ACCESS_SECRET: test_ci_access_secret_64_bytes_00000000000000000000000000000000
          JWT_REFRESH_SECRET: test_ci_refresh_secret_64_bytes_00000000000000000000000000000000
